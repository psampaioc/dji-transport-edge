/map_publisher:
  ros__parameters:
    # Public checkout: disabled until the operator creates mapper.local.yaml
    # plus their own map_vis.pcd and map_metadata.json.
    enabled: false
    pcd_file_path: "config/map_vis.pcd"
    map_frame: "map"
    topic_name: "/map/cloud"
    publish_once: true

/drone_localization_node:
  ros__parameters:
    navigation_topic: "/dji/navigation/state"
    frame_context_topic: "/dji/primary/frame_context"
    pose_topic: "/dji/navigation/pose"
    frame_pose_topic: "/dji/frame/pose"
    path_topic: "/dji/navigation/path"
    status_topic: "/dji/navigation/status"
    frame_id: "map"
    child_frame: "dji_aircraft"
    enabled: false
    # Placeholder only; set the real site projection in mapper.local.yaml.
    utm_zone: 1
    utm_south: false
    map_metadata_path: "config/map_metadata.json"
    enable_map_bounds_check: true
    map_margin_m: 5.0
    enable_jump_gate: true
    max_speed_mps: 20.0
    max_gate_dt_s: 10.0
    position_tolerance_m: 2.0
    min_path_spacing_m: 0.15
    max_history_points: 5000

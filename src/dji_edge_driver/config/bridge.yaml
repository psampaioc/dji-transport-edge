/dji_edge_driver:
  ros__parameters:
    # Direct Android protocol ports; do not change without Android evidence.
    bind_host: "0.0.0.0"
    telemetry_port: 5500
    frame_metadata_port: 5501
    clock_port: 5502
    primary_rtp_port: 5600
    fpv_rtp_port: 5610
    max_json_bytes: 1200
    rtp_payload_type: 96
    rtp_latency_ms: 20
    # ROS images are the normal visual/processing route. Native preview is diagnostic opt-in.
    preview_windows: false
    # Disabled by default: this writes diagnostic RTP records under evidence_dir.
    capture_rtp: false
    evidence_dir: "evidence"
    android_clock_host: ""
    android_clock_port: 5502
    clock_ping_interval_s: 1.0
    clock_response_timeout_s: 0.5
    dashboard_enabled: true
    dashboard_host: "127.0.0.1"
    dashboard_port: 8090
    # Disables ROS image publication only; RTP ingress/health stays active.
    publish_video: true
    primary_topic: "/dji/primary/image_raw"
    fpv_topic: "/dji/fpv/image_raw"
    primary_context_topic: "/dji/primary/frame_context"
    fpv_context_topic: "/dji/fpv/frame_context"
    navigation_topic: "/dji/navigation/state"
    mapper_status_topic: "/dji/navigation/status"
    mapper_status_stale_s: 3.0
    diagnostics_topic: "/dji/diagnostics"
    transport_metrics_topic: "/dji/edge/transport_metrics"

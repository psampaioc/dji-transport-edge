/dji_edge_bridge:
  ros__parameters:
    # Direct Android protocol ports; do not change without Android evidence.
    bind_host: "0.0.0.0"
    telemetry_port: 5500
    frame_metadata_port: 5501
    clock_port: 5502
    primary_rtp_port: 5600
    fpv_rtp_port: 5610
    max_json_bytes: 1200
    rtp_payload_type: 96
    rtp_latency_ms: 20
    preview_windows: true
    evidence_dir: "evidence"
    publish_video: true
    primary_topic: "/dji/primary/image_raw"
    fpv_topic: "/dji/fpv/image_raw"
    navigation_topic: "/dji/navigation/state"
    flight_topic: "/dji/telemetry/flight"
    rtk_topic: "/dji/telemetry/rtk"
    gimbal_topic: "/dji/telemetry/gimbal"
    frame_metadata_topic: "/dji/telemetry/frame_metadata"
    diagnostics_topic: "/dji/diagnostics"

/dji_edge_bridge:
  ros__parameters:
    # Host networking reaches the native Ubuntu edge receiver.
    state_url: "http://127.0.0.1:8088/v1/state"
    state_poll_hz: 10.0
    primary_relay_port: 5602
    fpv_relay_port: 5612
    rtp_payload_type: 96
    rtp_latency_ms: 20
    publish_video: true
    primary_topic: "/dji/primary/image_raw"
    fpv_topic: "/dji/fpv/image_raw"
    navigation_topic: "/dji/navigation/state"
    flight_topic: "/dji/telemetry/flight"
    rtk_topic: "/dji/telemetry/rtk"
    gimbal_topic: "/dji/telemetry/gimbal"
    diagnostics_topic: "/dji/diagnostics"
